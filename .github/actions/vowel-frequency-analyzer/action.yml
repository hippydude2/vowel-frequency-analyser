
name: 'Vowel Frequency Analyzer'
description: 'Custom action to analyze vowel frequency in a text file.'

inputs:
  file:
    description: 'The path to the text file to analyze (e.g., data.txt).'
    required: true

runs:
  using: 'docker'
  image: '../../../Dockerfile'
  env:
    FILE: ${{ inputs.file }}
